[package]
name = "orangeencrypt"
version = "1.0.0"
description = "Criptografia de arquivos OpenPGP, local e sem formato proprietário"
authors = ["orange"]
edition = "2021"

[lib]
name = "orangeencrypt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Backend criptográfico puro em Rust, sem libnettle/OpenSSL do sistema.
# Facilita o empacotamento multiplataforma. S2K, cifra e integridade ficam na Sequoia.
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto", "compression"] }
thiserror = "2"
zeroize = { version = "1", features = ["alloc"] }
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "orangeEncrypt"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
