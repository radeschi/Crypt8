name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            release_os: macos
            release_arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            release_os: macos
            release_arch: x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            release_os: linux
            release_arch: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            release_os: linux
            release_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            release_os: windows
            release_arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            release_os: windows
            release_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci

      - name: Assinatura ad-hoc no macOS sem Developer ID
        if: runner.os == 'macOS'
        run: |
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          uploadUpdaterJson: false

      - name: Compilar e publicar rascunho
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: "v__VERSION__"
          releaseName: "orangeEncrypt v__VERSION__"
          releaseBody: |
            ## orangeEncrypt v__VERSION__

            Release automática do orangeEncrypt.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

      - name: Padronizar nomes da Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_OS: ${{ matrix.release_os }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export APP_VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          export RELEASE_TAG="v${APP_VERSION}"
          python3 scripts/rename-release-assets.py

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: orangeEncrypt-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
